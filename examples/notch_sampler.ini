[run]
popsummary_file = /path/to/popsummary.h5
output = notch_samples.parquet
n_events = 10000
seed = 1234
batch_size = 1
no_extrinsics = false

[model]
name = notch
warn_if_unvalidated = true

[grid]
m1_min = 1.0
m1_max = 300.0
q_min = 0.001
q_max = 1.0
mass_grid_size = 1200
q_grid_size = 500
z_grid_size = 4096
spin_grid_size = 2048

[redshift]
# Choices: power_law, madau_dickinson
model = power_law
power_law_index = lamb

# For Madau-Dickinson, switch to:
# model = madau_dickinson
# madau_alpha = 2.7
# madau_beta = 2.9
# madau_z_peak = 1.9

[redshift_evolution]
enabled = false
reference_z = 0.0
