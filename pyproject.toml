[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "popsampler"
version = "0.1.0"
description = "Posterior-predictive population samplers for compact-binary population releases."
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Vaishak Prasad"}]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=2.0",
    "h5py>=3.8",
    "requests>=2.31",
    "astropy>=5.3",
    "tqdm>=4.66",
]

[project.optional-dependencies]
gwtc4 = ["popsummary"]
parquet = ["pyarrow>=14"]
dev = ["pytest", "ruff"]

[project.scripts]
popsampler-download-gwtc4 = "popsampler.scripts.download_gwtc4:main"
popsampler-inspect = "popsampler.scripts.inspect_popsummary:main"
popsampler-sample-bbh = "popsampler.scripts.sample_bbh:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
